name: SecretShield

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan for security risks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run SecretShield
        uses: ./.github/actions/secretshield
        with:
          path: .
          fail-on: high
